# Unbind defaults that conflict with application bindings
unbind = SUPER, F  # was: fullscreen
unbind = SUPER, T  # was: toggle floating
unbind = SUPER, O  # was: pop window out
unbind = SUPER, G  # was: toggle group
unbind = SUPER, S  # was: toggle scratchpad
unbind = SUPER, C  # was: (if any)
unbind = SUPER, L  # was: (if any)
unbind = SUPER, H  # was: (if any)

# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, G, Chrome (Default), exec, uwsm-app -- google-chrome-stable --profile-directory="Default" --new-window --ozone-platform=wayland
bindd = SUPER SHIFT, G, Chrome (Profile 4), exec, uwsm-app -- google-chrome-stable --profile-directory="Profile 4" --new-window --ozone-platform=wayland
bindd = SUPER, M, Music, exec, uwsm-app -- spotify
bindd = SUPER, T, System monitor, exec, uwsm-app -- xdg-terminal-exec -e btop
bindd = SUPER, O, Obsidian, exec, uwsm-app -- obsidian -disable-gpu
bindd = SUPER, Z, Zed, exec, uwsm-app -- gtk-launch dev.zed.Zed
bindd = SUPER, C, VS Code, exec, uwsm-app -- code
bindd = SUPER, U, Opencode, exec, uwsm-app -- xdg-terminal-exec -e opencode

# Web apps (if your URL contains #, type it as ## to prevent hyprland treating it as a comment)
bindd = SUPER, H, GitHub, exec, omarchy-launch-webapp "https://github.com"
bindd = SUPER, R, GitHub, exec, omarchy-launch-webapp "https://app.graphite.com/"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER, S, Slack, exec, uwsm-app -- slack
bindd = SUPER, L, Linear, exec, omarchy-launch-webapp "https://linear.app"
bindd = SUPER, N, Notion, exec, omarchy-launch-webapp "https://notion.so"



# hyprwhspr - Toggle mode (added by hyprwhspr setup)
# Press once to start, press again to stop
bindd = SUPER ALT, X, Speech-to-text, exec, /usr/lib/hyprwhspr/config/hyprland/hyprwhspr-tray.sh record
