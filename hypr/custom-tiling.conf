# bind = SUPER SHIFT, code:18, movetoworkspace, 9
# bind = SUPER SHIFT, code:19, movetoworkspace, 10

### Custom workspace offsets
# Smart context switching with F-keys (preserves workspace offset within context)
bind = SUPER, F1, exec, ~/.config/hypr/scripts/smart-context-switch.sh 1      # Context 1: workspaces 1-10
bind = SUPER, F2, exec, ~/.config/hypr/scripts/smart-context-switch.sh 2      # Context 2: workspaces 11-20
bind = SUPER, F3, exec, ~/.config/hypr/scripts/smart-context-switch.sh 3      # Context 3: workspaces 21-30
bind = SUPER, F4, exec, ~/.config/hypr/scripts/smart-context-switch.sh 4      # Context 4: workspaces 31-40
bind = SUPER, F5, exec, ~/.config/hypr/scripts/smart-context-switch.sh 5      # Context 5: workspaces 41-50
bind = SUPER, F6, exec, ~/.config/hypr/scripts/smart-context-switch.sh 6      # Context 6: workspaces 51-60
bind = SUPER, F7, exec, ~/.config/hypr/scripts/smart-context-switch.sh 7      # Context 7: workspaces 61-70
bind = SUPER, F8, exec, ~/.config/hypr/scripts/smart-context-switch.sh 8      # Context 8: workspaces 71-80
bind = SUPER, F9, exec, ~/.config/hypr/scripts/smart-context-switch.sh 9      # Context 9: workspaces 81-90
bind = SUPER, F10, exec, ~/.config/hypr/scripts/smart-context-switch.sh 10    # Context 10: workspaces 91-100
bind = SUPER, F11, exec, ~/.config/hypr/scripts/smart-context-switch.sh 11    # Context 11: workspaces 101-110
bind = SUPER, F12, exec, ~/.config/hypr/scripts/smart-context-switch.sh 12    # Context 12: workspaces 111-120

# Smart workspace navigation within current context (SUPER + 1-9 keys)
bind = SUPER, code:10, exec, ~/.config/hypr/scripts/smart-workspace.sh 1
bind = SUPER, code:11, exec, ~/.config/hypr/scripts/smart-workspace.sh 2
bind = SUPER, code:12, exec, ~/.config/hypr/scripts/smart-workspace.sh 3
bind = SUPER, code:13, exec, ~/.config/hypr/scripts/smart-workspace.sh 4
bind = SUPER, code:14, exec, ~/.config/hypr/scripts/smart-workspace.sh 5
bind = SUPER, code:15, exec, ~/.config/hypr/scripts/smart-workspace.sh 6
bind = SUPER, code:16, exec, ~/.config/hypr/scripts/smart-workspace.sh 7
bind = SUPER, code:17, exec, ~/.config/hypr/scripts/smart-workspace.sh 8
bind = SUPER, code:18, exec, ~/.config/hypr/scripts/smart-workspace.sh 9
bind = SUPER, code:19, exec, ~/.config/hypr/scripts/smart-workspace.sh 10

# Smart window moving within current context (replaces your existing binds)
bind = SUPER SHIFT, code:10, exec, ~/.config/hypr/scripts/smart-move.sh 1
bind = SUPER SHIFT, code:11, exec, ~/.config/hypr/scripts/smart-move.sh 2
bind = SUPER SHIFT, code:12, exec, ~/.config/hypr/scripts/smart-move.sh 3
bind = SUPER SHIFT, code:13, exec, ~/.config/hypr/scripts/smart-move.sh 4
bind = SUPER SHIFT, code:14, exec, ~/.config/hypr/scripts/smart-move.sh 5
bind = SUPER SHIFT, code:15, exec, ~/.config/hypr/scripts/smart-move.sh 6
bind = SUPER SHIFT, code:16, exec, ~/.config/hypr/scripts/smart-move.sh 7
bind = SUPER SHIFT, code:17, exec, ~/.config/hypr/scripts/smart-move.sh 8
bind = SUPER SHIFT, code:18, exec, ~/.config/hypr/scripts/smart-move.sh 9
bind = SUPER SHIFT, code:19, exec, ~/.config/hypr/scripts/smart-move.sh 10

# Move windows between contexts while maintaining workspace offset
bind = SUPER SHIFT, F1, exec, ~/.config/hypr/scripts/move-between-contexts.sh 1
bind = SUPER SHIFT, F2, exec, ~/.config/hypr/scripts/move-between-contexts.sh 2
bind = SUPER SHIFT, F3, exec, ~/.config/hypr/scripts/move-between-contexts.sh 3
bind = SUPER SHIFT, F4, exec, ~/.config/hypr/scripts/move-between-contexts.sh 4
bind = SUPER SHIFT, F5, exec, ~/.config/hypr/scripts/move-between-contexts.sh 5
bind = SUPER SHIFT, F6, exec, ~/.config/hypr/scripts/move-between-contexts.sh 6
bind = SUPER SHIFT, F7, exec, ~/.config/hypr/scripts/move-between-contexts.sh 7
bind = SUPER SHIFT, F8, exec, ~/.config/hypr/scripts/move-between-contexts.sh 8
bind = SUPER SHIFT, F9, exec, ~/.config/hypr/scripts/move-between-contexts.sh 9
bind = SUPER SHIFT, F10, exec, ~/.config/hypr/scripts/move-between-contexts.sh 10
bind = SUPER SHIFT, F11, exec, ~/.config/hypr/scripts/move-between-contexts.sh 11
bind = SUPER SHIFT, F12, exec, ~/.config/hypr/scripts/move-between-contexts.sh 12






# Swap active window with the one next to it with mainMod + SHIFT + arrow keys
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Resize active window
bind = SUPER, minus, resizeactive, -100 0
bind = SUPER, equal, resizeactive, 100 0
bind = SUPER SHIFT, minus, resizeactive, 0 -100
bind = SUPER SHIFT, equal, resizeactive, 0 100

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
