# Custom environment variable overrides
# This file is sourced after the Omarchy defaults to override specific values

# Cursor theme configuration
env = XCURSOR_THEME,Yaru
env = HYPRCURSOR_THEME,Yaru

# Override SDL_VIDEODRIVER to allow fallback to x11 and windows
# This helps with Steam games that have issues with pure Wayland
env = SDL_VIDEODRIVER,wayland,x11,windows

# Use AMD RX 9070 (renderD129) as the primary GPU for all applications
# instead of the Intel Iris Xe iGPU (renderD128)
env = DRI_PRIME,1